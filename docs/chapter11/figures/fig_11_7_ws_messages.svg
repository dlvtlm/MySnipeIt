<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif">
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#b9770e"/>
    </marker>
    <marker id="a2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#6c3483"/>
    </marker>
    <style>
      .k  { fill:#8e44ad; }
      .s  { fill:#1e7a46; }
      .n  { fill:#b9770e; }
      .b  { fill:#c0392b; }
      .p  { fill:#5d6d7e; }
      .mono { font-family:'Consolas','Courier New','DejaVu Sans Mono',monospace; font-size:13px; }
    </style>
  </defs>

  <rect width="960" height="660" fill="#ffffff"/>

  <!-- ============ Inbound ============ -->
  <rect x="30" y="24" width="900" height="344" rx="8" fill="#fffdf7" stroke="#b9770e" stroke-width="1.6"/>

  <text x="906" y="50" font-size="14.5" font-weight="bold" fill="#7e5109" direction="rtl" text-anchor="start">הודעת זיהוי מטרות המתקבלת מהמכשיר</text>
