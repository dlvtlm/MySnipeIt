  <text x="739" y="337" font-size="10.5" fill="#8a6234" direction="rtl" text-anchor="middle">פענוח ותקשורת</text>

  <rect x="470" y="296" width="170" height="56" rx="5" fill="#ffffff" stroke="#a2764a"/>
  <text x="555" y="319" font-size="11.5" fill="#4a3419" text-anchor="middle">WifiBinder</text>
  <text x="555" y="337" font-size="10.5" fill="#8a6234" direction="rtl" text-anchor="middle">כפיית ניתוב לרשת</text>

  <rect x="286" y="296" width="170" height="56" rx="5" fill="#ffffff" stroke="#a2764a"/>
  <text x="371" y="319" font-size="11.5" fill="#4a3419" direction="rtl" text-anchor="middle">מנוע פתרון הירי</text>
  <text x="371" y="337" font-size="10.5" fill="#8a6234" text-anchor="middle">Localizer + Solver</text>

  <rect x="116" y="296" width="154" height="56" rx="5" fill="#ffffff" stroke="#a2764a"/>
  <text x="193" y="319" font-size="11.5" fill="#4a3419" direction="rtl" text-anchor="middle">מודלי נתונים</text>
  <text x="193" y="337" font-size="10.5" fill="#8a6234" text-anchor="middle">ddl_frame</text>

  <path d="M270,368 L270,402" fill="none" stroke="#37474f" stroke-width="1.8" marker-end="url(#ar)"/>

