<svg xmlns="http://www.w3.org/2000/svg" width="980" height="724" viewBox="0 0 980 724" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#37474f"/>
    </marker>
    <marker id="arDash" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#8e44ad"/>
    </marker>
    <marker id="arVid" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1e7a46"/>
    </marker>
  </defs>

  <rect width="980" height="724" fill="#ffffff"/>

  <!-- ===== Field device ===== -->
  <rect x="150" y="20" width="700" height="96" rx="8" fill="#eef2f7" stroke="#34495e" stroke-width="1.6"/>
  <text x="836" y="42" font-size="15" font-weight="bold" fill="#22313f" direction="rtl" text-anchor="start">מכשיר השטח</text>
  <text x="836" y="60" font-size="11.5" fill="#5d6d7e" text-anchor="end">Raspberry Pi 5</text>

  <rect x="620" y="66" width="196" height="38" rx="5" fill="#ffffff" stroke="#7f8c8d"/>
  <text x="718" y="90" font-size="12.5" fill="#22313f" direction="rtl" text-anchor="middle">חיישני סביבה</text>

  <rect x="404" y="66" width="196" height="38" rx="5" fill="#ffffff" stroke="#7f8c8d"/>
  <text x="502" y="90" font-size="12.5" fill="#22313f" direction="rtl" text-anchor="middle">מצלמה וזיהוי מטרות</text>

  <rect x="188" y="66" width="196" height="38" rx="5" fill="#ffffff" stroke="#7f8c8d"/>
  <text x="286" y="90" font-size="12.5" fill="#22313f" direction="rtl" text-anchor="middle">מערך מיקרופונים</text>

  <!-- device -> channels -->
  <path d="M718,104 L718,140 L300,140 L300,158" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M286,104 L286,128 L200,128 L200,158" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M502,104 L502,140 L700,140 L700,158" fill="none" stroke="#1e7a46" stroke-width="1.8" marker-end="url(#arVid)"/>

  <!-- ===== Channels ===== -->
  <rect x="120" y="158" width="300" height="52" rx="6" fill="#fdf3e3" stroke="#b9770e" stroke-width="1.6"/>
  <text x="270" y="180" font-size="13" font-weight="bold" fill="#7e5109" direction="rtl" text-anchor="middle">ערוץ בקרה דו-כיווני</text>
  <text x="270" y="198" font-size="11.5" fill="#7e5109" text-anchor="middle">WebSocket : 8555</text>

  <rect x="560" y="158" width="300" height="52" rx="6" fill="#e8f6ee" stroke="#1e7a46" stroke-width="1.6"/>
  <text x="710" y="180" font-size="13" font-weight="bold" fill="#145a32" direction="rtl" text-anchor="middle">ערוץ וידאו חד-כיווני</text>
  <text x="710" y="198" font-size="11.5" fill="#145a32" text-anchor="middle">RTSP : 8554</text>

  <path d="M270,210 L270,244" fill="none" stroke="#37474f" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- ===== Model layer ===== -->
  <rect x="100" y="244" width="760" height="124" rx="8" fill="#faf4ec" stroke="#8e5a2b" stroke-width="1.6"/>
  <text x="846" y="268" font-size="14.5" font-weight="bold" fill="#6e4520" direction="rtl" text-anchor="start">שכבת הנתונים</text>
  <text x="846" y="286" font-size="11" fill="#a2764a" text-anchor="end">Model</text>

  <rect x="654" y="296" width="170" height="56" rx="5" fill="#ffffff" stroke="#a2764a"/>
