  <rect x="100" y="402" width="760" height="112" rx="8" fill="#f5eefa" stroke="#6c3483" stroke-width="1.6"/>
  <text x="846" y="426" font-size="14.5" font-weight="bold" fill="#512e5f" direction="rtl" text-anchor="start">שכבת ניהול המצב</text>
  <text x="846" y="444" font-size="11" fill="#8e44ad" text-anchor="end">ViewModel</text>

  <rect x="356" y="440" width="300" height="58" rx="5" fill="#ffffff" stroke="#8e44ad"/>
  <text x="506" y="463" font-size="12.5" font-weight="bold" fill="#512e5f" text-anchor="middle">SniperViewModel</text>
  <text x="506" y="483" font-size="10.5" fill="#7d3c98" text-anchor="middle">StateFlow &#215; 14</text>

  <rect x="116" y="440" width="220" height="58" rx="5" fill="#ffffff" stroke="#8e44ad"/>
  <text x="226" y="461" font-size="10.5" fill="#512e5f" direction="rtl" text-anchor="middle">ייצוב נתוני חיישנים</text>
  <text x="226" y="479" font-size="10.5" fill="#512e5f" direction="rtl" text-anchor="middle">ניהול התראות וכיול</text>

  <path d="M506,514 L506,548" fill="none" stroke="#37474f" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="516" y="536" font-size="10.5" fill="#546e7a">collectAsStateWithLifecycle</text>

  <!-- ===== View layer ===== -->
  <rect x="100" y="548" width="760" height="112" rx="8" fill="#eaf5ee" stroke="#1e7a46" stroke-width="1.6"/>
  <text x="846" y="572" font-size="14.5" font-weight="bold" fill="#145a32" direction="rtl" text-anchor="start">שכבת התצוגה</text>
  <text x="846" y="590" font-size="11" fill="#1e8449" text-anchor="end">View &#183; Jetpack Compose</text>

  <rect x="672" y="598" width="146" height="46" rx="5" fill="#ffffff" stroke="#1e8449" stroke-width="2"/>
  <text x="745" y="626" font-size="12.5" font-weight="bold" fill="#145a32" direction="rtl" text-anchor="middle">דשבורד מבצעי</text>

  <rect x="518" y="598" width="146" height="46" rx="5" fill="#ffffff" stroke="#1e8449"/>
  <text x="591" y="626" font-size="12" fill="#145a32" direction="rtl" text-anchor="middle">דיאגנוסטיקה</text>

  <rect x="364" y="598" width="146" height="46" rx="5" fill="#ffffff" stroke="#1e8449"/>
  <text x="437" y="626" font-size="12" fill="#145a32" direction="rtl" text-anchor="middle">מפה</text>

  <rect x="210" y="598" width="146" height="46" rx="5" fill="#ffffff" stroke="#1e8449"/>
  <text x="283" y="626" font-size="12" fill="#145a32" direction="rtl" text-anchor="middle">בחירת מכשיר</text>

  <rect x="116" y="598" width="86" height="46" rx="5" fill="#ffffff" stroke="#1e8449"/>
  <text x="159" y="626" font-size="12" fill="#145a32" direction="rtl" text-anchor="middle">בית</text>

  <!-- video bypass: RTSP straight to the dashboard -->
  <path d="M860,184 L920,184 L920,621 L820,621" fill="none" stroke="#1e7a46" stroke-width="2" stroke-dasharray="0" marker-end="url(#arVid)"/>
  <text x="936" y="400" font-size="11.5" fill="#145a32" direction="rtl" text-anchor="middle" transform="rotate(90,936,400)">וידאו ישירות לנגן</text>

  <!-- commands back up -->
  <path d="M745,644 L745,672 L60,672 L60,184 L118,184" fill="none" stroke="#8e44ad" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arDash)"/>
  <text x="44" y="400" font-size="11.5" fill="#6c3483" direction="rtl" text-anchor="middle" transform="rotate(-90,44,400)">פקודות המפעיל</text>

  <!-- legend -->
  <line x1="640" y1="700" x2="676" y2="700" stroke="#37474f" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="632" y="704" font-size="11" fill="#37474f" direction="rtl" text-anchor="start">זרימת נתונים</text>
  <line x1="440" y1="700" x2="476" y2="700" stroke="#1e7a46" stroke-width="2" marker-end="url(#arVid)"/>
  <text x="432" y="704" font-size="11" fill="#145a32" direction="rtl" text-anchor="start">זרם וידאו</text>
  <line x1="256" y1="700" x2="292" y2="700" stroke="#8e44ad" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arDash)"/>
  <text x="248" y="704" font-size="11" fill="#6c3483" direction="rtl" text-anchor="start">פקודות</text>
